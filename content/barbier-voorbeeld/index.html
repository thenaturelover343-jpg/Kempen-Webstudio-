    <!-- Hero video in static HTML: Safari starts loading while parsing, before the JS bundle. React positions/animates this layer and never moves it (lib/heroVideo.ts). -->
    <div id="hv-host" aria-hidden="true">
      <div id="hv-par" style="position:absolute;inset:0;will-change:transform">
      <video id="hero-video" autoplay muted playsinline webkit-playsinline loop preload="auto" disablepictureinpicture tabindex="-1" aria-hidden="true" style="width:100%;height:100%;object-fit:cover;display:block">

      <source src="/barbier-voorbeeld/video/barbier-1920.hevc.mp4" type='video/mp4; codecs="hvc1"' />
      <source src="/barbier-voorbeeld/video/barbier-1920.mp4" type="video/mp4" />
      </video>
      </div>
    </div>
    <!-- intro lid over #hv-host (same box, page colour): its hole opens top-down exactly like the old clip on the host did.
         The video under it is never clipped or hidden, so iOS keeps it playing during the intro. React places it with the host and removes it after the reveal. -->
    <div id="hv-cover" aria-hidden="true"><div id="hv-hole"></div></div>
    <script>(function(){var v=document.getElementById('hero-video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.poster=matchMedia('(max-width: 767px)').matches?'/barbier-voorbeeld/img/barbier-poster-m.webp':'/barbier-voorbeeld/img/barbier-poster.webp';var g=!matchMedia('(prefers-reduced-motion: reduce)').matches&&!/[?&]nogate/.test(location.search);try{if(sessionStorage.getItem('bk-gate'))g=false}catch(e){}if(!g){var c=document.getElementById('hv-cover');if(c)c.remove()}if(matchMedia('(prefers-reduced-motion: reduce)').matches){v.autoplay=false;v.removeAttribute('autoplay');v.pause()}else{var p=v.play();if(p)p.catch(function(){})}})()</script>
    <div id="root"></div>
  </body>
