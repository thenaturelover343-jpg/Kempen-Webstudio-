    <style>.hv-lid{pointer-events:none;background:#13110d;position:absolute;inset:0}#hv-lid1{animation:1.15s cubic-bezier(.77,0,.175,1) .1s both hvlid1}#hv-lid2{animation:1.15s cubic-bezier(.77,0,.175,1) .1s both hvlid2}@keyframes hvlid1{0%{clip-path:inset(0 0 53%)}to{clip-path:inset(0 0 100%)}}@keyframes hvlid2{0%{clip-path:inset(53% 0 0)}to{clip-path:inset(100% 0 0)}}@media (prefers-reduced-motion:reduce){.hv-lid{display:none}}.hv-ov{position:absolute;inset:0}#hv-ov1{background:linear-gradient(#13110dc7 0%,#13110d4d 16%,#13110d24 30%,#13110d6b 50%,#13110df2 100%)}#hv-ov2{background:#13110d70}#hv-ov3{background:linear-gradient(270deg,#13110d8c 0%,#13110d00 55%);display:none}@media (width>=1024px){#hv-ov2{display:none}#hv-ov3{display:block}}</style>

  </head>
  <body>
    <!-- Hero video in static HTML: Safari starts loading while parsing, before the JS bundle. React positions/animates this layer and never moves it (lib/heroVideo.ts). -->
    <div id="hv-host" aria-hidden="true" style="position:absolute;top:0;left:0;width:100%;height:100vh;height:100svh;min-height:620px;background:#13110D;overflow:hidden;pointer-events:none">
      <div id="hv-par" style="position:absolute;top:-2%;bottom:-10%;left:0;right:0;will-change:transform">
      <video id="hero-video" autoplay muted playsinline webkit-playsinline loop preload="auto" disablepictureinpicture tabindex="-1" aria-hidden="true" style="width:100%;height:100%;object-fit:cover;display:block">
      <source media="(max-width: 767px)" src="/tuin-voorbeeld/video/tuin-m.hevc.mp4" type='video/mp4; codecs="hvc1"' />
      <source media="(max-width: 767px)" src="/tuin-voorbeeld/video/tuin-m.mp4" type="video/mp4" />
      <source src="/tuin-voorbeeld/video/tuin-1920.hevc.mp4" type='video/mp4; codecs="hvc1"' />
      <source media="(min-width: 1280px), (min-resolution: 1.5dppx)" src="/tuin-voorbeeld/video/tuin-1920.mp4" type="video/mp4" />
      <source src="/tuin-voorbeeld/video/tuin-1280.mp4" type="video/mp4" />
      </video>
      </div>
      <div class="hv-ov" id="hv-ov1"></div><div class="hv-ov" id="hv-ov2"></div><div class="hv-ov" id="hv-ov3"></div>
      <!-- intro lids: two page-colour bars that open from the middle exactly like the old clip on #hv-host; the video under them is never clipped, so iOS keeps it playing during the intro -->
      <div class="hv-lid" id="hv-lid1"></div><div class="hv-lid" id="hv-lid2"></div>
    </div>
    <script>(function(){var v=document.getElementById('hero-video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.poster=matchMedia('(max-width: 767px)').matches?'/tuin-voorbeeld/img/tuin-poster-m.webp':'/tuin-voorbeeld/img/tuin-poster.webp';if(matchMedia('(prefers-reduced-motion: reduce)').matches){v.autoplay=false;v.removeAttribute('autoplay');v.pause()}else{var p=v.play();if(p)p.catch(function(){});var l=document.getElementById('hv-lid2');if(l)l.addEventListener('animationend',function(){if(v.paused&&v.dataset.up!=='1'){var q=v.play();if(q)q.catch(function(){})}})}})()</script>
    <div id="root"></div>
  </body>
