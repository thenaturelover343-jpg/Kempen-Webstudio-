    <!-- Hero geometry has ONE source of truth: the inline script below writes --x0/--y0/--w0/--h0 (the video plate: small on phones, near full-bleed on desktop),
         --fs (headline size), --tx/--ty (how far the film is shifted so the face sits in the plate) and --p (expansion
         0..1) on <html>. The static video layer and the React overlays both read these, so the plate is placed before JS. -->
    <style>:root{--p:0;--pin:260svh;--x0:30vw;--y0:24svh;--w0:40vw;--h0:60svh;--tx:0px;--ty:0px;--gl:20px;--fs:80px;--t1:76px}#hv-host{height:var(--pin);pointer-events:none;z-index:0;position:absolute;top:0;left:0;right:0}#hv-stick{height:100lvh;position:sticky;top:0;overflow:hidden}#hv-clip{clip-path:inset(calc(var(--y0) * (1 - var(--p))) calc((100% - var(--x0) - var(--w0)) * (1 - var(--p))) calc((100% - var(--y0) - var(--h0)) * (1 - var(--p))) calc(var(--x0) * (1 - var(--p))));will-change:clip-path;background:#6f5444;position:absolute;inset:0}#hv-par{transform:translate3d(calc(var(--tx) * (1 - var(--p))),calc(var(--ty) * (1 - var(--p))),0);position:absolute;inset:0}#hv-par>video{object-fit:cover;width:100%;height:100%;display:block;position:absolute;inset:0}#hv-shade{opacity:calc((var(--p) - .6) * 2.5);background:linear-gradient(#0d152600 30%,#0d152673 62%,#0d1526d1);position:absolute;inset:0}video::-webkit-media-controls-start-playback-button{-webkit-appearance:none;display:none!important}</style>

  </head>
  <body>
    <!-- Static hero film: Safari starts loading it while parsing, before the JS bundle. It is never moved or re-created;
         it pins with position:sticky inside #hv-host (same height as the React hero) and is only clipped/shifted. -->
    <div id="hv-host" aria-hidden="true">
      <div id="hv-stick">
        <div id="hv-clip">
          <div id="hv-par">
            <video id="hero-video" autoplay muted playsinline webkit-playsinline loop preload="auto" disablepictureinpicture tabindex="-1" aria-hidden="true">
              <source media="(max-width: 1023px)" src="/schoonheidssalon-voorbeeld/video/velours-m.mp4" type="video/mp4" />
              <source src="/schoonheidssalon-voorbeeld/video/velours-d.mp4" type="video/mp4" />
            </video>
          </div>
          <div id="hv-shade"></div>
        </div>
      </div>
    </div>
    <script>
    (function(){
      var d=document.documentElement,rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
      function geo(){
        var W=d.clientWidth,H=innerHeight,l=W>=1024,gl,fs,t1,w0,h0,x0,y0;
        if(!l){gl=W<768?20:32;t1=W<768?76:96;fs=Math.round(Math.min(W*.205,H*.14,150));y0=Math.round(t1+fs*.52);w0=W-2*gl;x0=gl;h0=Math.round(Math.max(150,Math.min(H-y0-fs*.48-(W<768?218:240),w0*1.45)))}
        else{gl=Math.round(Math.max((W-1520)/2,0)+Math.max(W*.036,32));t1=96;fs=Math.round(Math.min(W*.082,H*.15,150));/* desktop: near full-bleed frame under the header (~88% of the viewport) */y0=84;x0=14;w0=W-28;h0=H-y0-14}
        /* shift the film so its brightest detail sits in the plate, never uncovering an edge */
        var va=l?1600/900:720/1280,dw,dh,ox,oy;
        if(W/H>va){dw=W;dh=W/va;ox=0;oy=(H-dh)/2}else{dh=H;dw=H*va;oy=0;ox=(W-dw)/2}
        var fx=l?.5:.46,fy=l?.5:.42,tx=(x0+w0/2)-(ox+fx*dw),ty=(y0+h0/2)-(oy+fy*dh);
        tx=Math.min(Math.max(tx,x0+w0-(ox+dw)),x0-ox);ty=Math.min(Math.max(ty,y0+h0-(oy+dh)),y0-oy);
        var st=d.style;st.setProperty('--gl',gl+'px');st.setProperty('--fs',fs+'px');st.setProperty('--t1',t1+'px');st.setProperty('--x0',x0+'px');st.setProperty('--y0',y0+'px');st.setProperty('--w0',w0+'px');st.setProperty('--h0',h0+'px');st.setProperty('--tx',Math.round(tx)+'px');st.setProperty('--ty',Math.round(ty)+'px');
        if(rm)st.setProperty('--pin','100lvh');
      }
      geo();window.__geo=geo;
      var w0=-1;addEventListener('resize',function(){if(d.clientWidth!==w0){w0=d.clientWidth;geo()}});w0=d.clientWidth;
      var v=document.getElementById('hero-video'),m=matchMedia('(max-width: 1023px)').matches;
      v.muted=true;v.defaultMuted=true;v.playsInline=true;v.poster=m?'/schoonheidssalon-voorbeeld/img/hero-poster-m.webp':'/schoonheidssalon-voorbeeld/img/hero-poster.webp';
      if(rm){v.autoplay=false;v.removeAttribute('autoplay');v.pause()}else{var p=v.play();if(p)p.catch(function(){})}
    })()
    </script>
    <div id="root"></div>
  </body>
