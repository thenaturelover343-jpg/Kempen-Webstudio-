    <!-- One source of truth for the hero geometry: the static video layer (#hv-host), its intro lid (#hv-cover) and
         the React frame (.hf) all use these variables, so the video is placed before any JS runs. -->
    <style>:root{--gl:20px;--fs:calc((100vw - 40px) / 2.98);--mt:calc(60px + env(safe-area-inset-top) + 10px);--vt:calc(var(--mt) + var(--fs) * .8 + 54px);--vh:max(300px,min(calc((100vw - 40px) * 1.25),calc(100svh - var(--vt) - 20px)))}@media (width>=640px){:root{--gl:32px;--fs:calc((100vw - 64px) / 2.98);--vh:max(320px,min(calc((100vw - 64px) * 1.1),calc(100svh - var(--vt) - 24px)))}}@media (width>=768px){:root{--vh:max(320px,min(calc((100vw - 64px) * .62),calc(100svh - var(--vt) - 24px)))}}@media (width>=1024px){:root{--gl:calc(max(0px,(100vw - 1440px) / 2) + max(4vw,32px));--fs:min(19vw,274px);--mt:calc(84px + 8px);--vt:calc(var(--mt) + var(--fs) * .8 + 40px);--vh:clamp(360px,calc(100svh - var(--vt) - 28px),calc((100vw - 2 * var(--gl)) * .5))}}.hf,#hv-host,#hv-cover{left:var(--gl);right:var(--gl);top:var(--vt);height:var(--vh);position:absolute}#hv-host{pointer-events:none;background:#d9d4cc;overflow:hidden}#hv-par{will-change:transform;position:absolute;inset:-6% 0}#hv-cover{pointer-events:none;z-index:2;overflow:hidden}#hv-cover>i{background:#edece8;animation:1.15s cubic-bezier(.77,0,.175,1) .25s both hvlift;position:absolute;inset:-1px;transform:translateY(0)}#hv-par{animation:1.8s cubic-bezier(.23,1,.32,1) .25s both hvset}@keyframes hvlift{to{transform:translateY(-101%)}}@keyframes hvset{0%{scale:1.1}to{scale:1}}@media (prefers-reduced-motion:reduce){#hv-cover{display:none}#hv-par{animation:none}}video::-webkit-media-controls-start-playback-button{-webkit-appearance:none;display:none!important}</style>

  <body>
    <!-- Hero video in static HTML: Safari starts loading while parsing, before the JS bundle. It is never moved,
         clipped or re-created (lib/heroVideo.ts); React only draws overlays above it. -->
    <div id="hv-host" aria-hidden="true">
      <div id="hv-par">
      <video id="hero-video" autoplay muted playsinline webkit-playsinline loop preload="auto" disablepictureinpicture tabindex="-1" aria-hidden="true" style="width:100%;height:100%;object-fit:cover;object-position:62% 38%;display:block">
      <source media="(max-width: 767px)" src="/kapsalon-voorbeeld/video/ivelien-m.hevc.mp4" type='video/mp4; codecs="hvc1"' />
      <source media="(max-width: 767px)" src="/kapsalon-voorbeeld/video/ivelien-m.mp4" type="video/mp4" />
      <source src="/kapsalon-voorbeeld/video/ivelien-d.hevc.mp4" type='video/mp4; codecs="hvc1"' />
      <source src="/kapsalon-voorbeeld/video/ivelien-d.mp4" type="video/mp4" />
      </video>
      </div>
    </div>
    <!-- Intro lid: one bone-coloured panel lifts off the video (transform only, pure CSS so it never waits for JS).
         The video under it keeps playing and is never clipped or hidden. Removed when done. -->
    <div id="hv-cover" aria-hidden="true"><i></i></div>
    <script>(function(){var v=document.getElementById('hero-video'),m=matchMedia('(max-width: 767px)').matches;v.muted=true;v.defaultMuted=true;v.playsInline=true;v.poster=m?'/kapsalon-voorbeeld/img/hero-poster-m.webp':'/kapsalon-voorbeeld/img/hero-poster.webp';if(m)v.style.objectPosition='50% 30%';var rm=matchMedia('(prefers-reduced-motion: reduce)').matches,c=document.getElementById('hv-cover');if(rm||/[?&]nogate/.test(location.search)){if(c)c.remove();document.getElementById('hv-par').style.animation='none'}else if(c){c.firstChild.addEventListener('animationend',function(){c.remove()})}if(rm){v.autoplay=false;v.removeAttribute('autoplay');v.pause()}else{var p=v.play();if(p)p.catch(function(){})}})()</script>
    <div id="root"></div>
  </body>
